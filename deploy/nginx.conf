# Reverse proxy for the OVH VPS deployment — see DEPLOY.md.
# Two upstreams: the Next.js app (port 3000) and the standalone Socket.io
# server (port 3001). Socket.io's client defaults to the `/socket.io/`
# path (lib/socket-client.ts sets no custom `path` option), so routing on
# that prefix works with zero application code changes — see the comment
# in DEPLOY.md's "Pourquoi ce découpage" section.

upstream app_upstream {
    server app:3000;
}

upstream socket_upstream {
    server socket:3001;
}

server {
    listen 80;
    server_name _;

    # Matches the largest real upload in the app (Deal Room PDF, 10 Mo) + margin.
    client_max_body_size 15M;

    # Socket.io — must come before the catch-all `location /` block.
    location /socket.io/ {
        proxy_pass http://socket_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived websocket connections — don't let Nginx time them out early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
