# Production stack for the OVH VPS — separate from docker-compose.yml
# (which stays as-is for local dev: Postgres/Redis/Adminer only, no app).
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres/Redis are NOT published to the public internet (127.0.0.1 only,
# or not published at all) — only Nginx exposes a port, and only 80 for now
# (IP-only deployment, no TLS yet — see DEPLOY.md for the HTTPS migration
# path once a domain is pointed here).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceosummit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ceo_summit
    volumes:
      - ceo_summit_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceosummit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ceo_summit_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # migrate deploy = the non-interactive, production-safe migration
    # command (unlike `migrate dev`, which refuses to run non-interactively —
    # see the EPERM/offline-migration notes in README.md for why that
    # distinction mattered throughout this project's local dev history).
    command: sh -c "npx prisma migrate deploy && npm run start"
    expose:
      - "3000"

  socket:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: npx tsx server/socket-server.ts
    expose:
      - "3001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
      - socket
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443"   # décommenter une fois un domaine + certificat en place, voir DEPLOY.md

volumes:
  ceo_summit_pg_data:
  ceo_summit_redis_data:
