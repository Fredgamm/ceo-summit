# Production stack for the OVH VPS — separate from docker-compose.yml
# (which stays as-is for local dev: Postgres/Redis/Adminer only, no app).
#
# Usage on the VPS — two phases, not a single `up -d --build`:
#   docker compose -f docker-compose.prod.yml up -d postgres redis
#   # wait for postgres to report healthy (docker compose ps)
#   docker compose -f docker-compose.prod.yml up -d --build
# Why: app/demande-acces/page.tsx is deliberately built as ISR (reads
# Referential rows via Prisma), so `next build` needs a reachable, migrated(-
# enough, an empty table is fine) Postgres already running *during* the
# `app`/`socket` image build, not just at container start — see the
# `build.network` below, which is what lets that build reach `postgres` by
# its service name. Building before Postgres exists fails with "Environment
# variable not found: DATABASE_URL" — really a live-connection problem, not
# a missing-var one.
#
# This VPS is shared with other projects (own Postgres/Redis on the host's
# standard ports, own nginx already bound to 80/443) — see DEPLOY.md. So,
# unlike a dedicated single-tenant VPS: Postgres/Redis are never published
# to the host at all (only reachable by `app`/`socket` over the internal
# Docker network, by service name), there's no nginx service here, and
# `app`/`socket` publish to 127.0.0.1-only ports that the host's own nginx
# (one vhost per project, /etc/nginx/conf.d/ceo-summit.conf) reverse-proxies
# to.
networks:
  default:
    name: ceo-summit-net

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceosummit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ceo_summit
    volumes:
      - ceo_summit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceosummit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ceo_summit_redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: ceo-summit-net
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # migrate deploy = the non-interactive, production-safe migration
    # command (unlike `migrate dev`, which refuses to run non-interactively —
    # see the EPERM/offline-migration notes in README.md for why that
    # distinction mattered throughout this project's local dev history).
    command: sh -c "npx prisma migrate deploy && npm run start"
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      # Interim disk-based file storage while R2 isn't configured yet (see
      # lib/r2.ts) — without this, every `up -d --build` (a fresh container)
      # would silently drop already-uploaded payment proofs/avatars/etc.
      - ceo_summit_local_storage:/app/.local-storage

  socket:
    build:
      context: .
      dockerfile: Dockerfile
      network: ceo-summit-net
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: npx tsx server/socket-server.ts
    ports:
      - "127.0.0.1:3021:3001"

volumes:
  ceo_summit_pg_data:
  ceo_summit_redis_data:
  ceo_summit_local_storage:
