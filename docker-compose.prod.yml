# Production stack for the OVH VPS — separate from docker-compose.yml
# (which stays as-is for local dev: Postgres/Redis/Adminer only, no app).
#
# 9 oct. 2026 — l'image n'est plus compilée sur le VPS : GitHub Actions la
# compile et la publie sur GHCR (ghcr.io/<propriétaire>/ceo-summit:<commit>),
# le VPS ne fait que la télécharger. La compilation saturait le processeur et
# la mémoire (3,7 Go) du serveur pendant ~15 min, en pleine production.
# Elle n'a besoin d'aucune base de données (vérifié : aucune page
# pré-générée ne lit Prisma depuis le retrait de /demande-acces).
#
# Usage on the VPS (fait par .github/workflows/ci-cd.yml) :
#   export IMAGE_TAG=<commit>
#   docker compose -f docker-compose.prod.yml pull app socket
#   docker compose -f docker-compose.prod.yml up -d --no-build
# Secours manuel, si GHCR est indisponible : `up -d --build` recompile sur
# place (bloc `build` conservé ci-dessous).
#
# This VPS is shared with other projects (own Postgres/Redis on the host's
# standard ports, own nginx already bound to 80/443) — see DEPLOY.md. So,
# unlike a dedicated single-tenant VPS: Postgres/Redis are never published
# to the host at all (only reachable by `app`/`socket` over the internal
# Docker network, by service name), there's no nginx service here, and
# `app`/`socket` publish to 127.0.0.1-only ports that the host's own nginx
# (one vhost per project, /etc/nginx/conf.d/ceo-summit.conf) reverse-proxies
# to.
#
# 14 oct. 2026 — deux instances sur ce VPS, chacune dans son dossier (le nom
# du dossier sert de nom de projet Compose : conteneurs et volumes séparés) :
#   /opt/ceo-summit       préprod  app.ceo-summit.mg  ports 3020/3021
#   /opt/ceo-summit-prod  prod     b2b.ceo-summit.mg  ports 3040/3041
#   (3030 est réservé au streaming RTMP viesaine/livespark, voir nginx.conf)
# Réseau et ports se règlent dans le .env de chaque instance (COMPOSE_NETWORK,
# HOST_APP_PORT, HOST_SOCKET_PORT) ; sans réglage, valeurs de la préprod.
networks:
  default:
    name: ${COMPOSE_NETWORK:-ceo-summit-net}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceosummit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ceo_summit
    volumes:
      - ceo_summit_pg_data:/var/lib/postgresql/data
    # 25 septembre 2026 (incident post-redémarrage VPS) — sans -d, pg_isready
    # cible par défaut une base du même nom que l'utilisateur ("ceosummit"),
    # qui n'existe pas (la vraie base est "ceo_summit", voir POSTGRES_DB
    # ci-dessus) : le check échouait donc en boucle (FATAL logué toutes les
    # 5s) sans jamais passer "healthy", sans empêcher postgres de fonctionner
    # pour de vrai — mais faussant l'état que lit `depends_on: service_healthy`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceosummit} -d ceo_summit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ceo_summit_redis_data:/data
    # 23 septembre 2026 (incident 502) — sans healthcheck, `app` (qui n'avait
    # aucune dépendance sur `redis` du tout, voir plus bas) pouvait démarrer
    # avant que Redis ne soit joignable, plantant en boucle sur
    # "[ioredis] getaddrinfo ENOTFOUND redis" pendant des heures après un
    # recreate — le conteneur restait "Up" quelques secondes à chaque fois
    # avant de re-planter, jamais assez longtemps pour qu'un simple retry
    # applicatif s'en remette seul.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${CEO_SUMMIT_IMAGE:-ghcr.io/fredgamm/ceo-summit}:${IMAGE_TAG:-latest}
    # Secours uniquement (compilation sur le VPS) — voir l'en-tête du fichier.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # migrate deploy = the non-interactive, production-safe migration
    # command (unlike `migrate dev`, which refuses to run non-interactively —
    # see the EPERM/offline-migration notes in README.md for why that
    # distinction mattered throughout this project's local dev history).
    # 9 oct. 2026 — plusieurs processus Next.js (server/web-cluster.js) pour
    # utiliser plusieurs cœurs ; WEB_CONCURRENCY dans .env (2 par défaut, à
    # relever si la mémoire du serveur augmente).
    command: sh -c "npx prisma migrate deploy && node server/web-cluster.js"
    ports:
      - "127.0.0.1:${HOST_APP_PORT:-3020}:3000"
    volumes:
      # Interim disk-based file storage while R2 isn't configured yet (see
      # lib/r2.ts) — without this, every `up -d --build` (a fresh container)
      # would silently drop already-uploaded payment proofs/avatars/etc.
      # Bind mount (not a named volume) so it's a known, backupable path on
      # the host — see deploy/backup.sh — at /opt/ceo-summit/.local-storage.
      - ./.local-storage:/app/.local-storage

  socket:
    image: ${CEO_SUMMIT_IMAGE:-ghcr.io/fredgamm/ceo-summit}:${IMAGE_TAG:-latest}
    # Secours uniquement (compilation sur le VPS) — voir l'en-tête du fichier.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx server/socket-server.ts
    ports:
      - "127.0.0.1:${HOST_SOCKET_PORT:-3021}:3001"

volumes:
  ceo_summit_pg_data:
  ceo_summit_redis_data:
